<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>跨平台通用語音指令 - VoiceStream</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container" style="padding-top: 50px;">
        <h1 style="color: #58a6ff; text-align: center; margin-bottom: 20px;">跨影音平台通用語音指令</h1>
        <p style="text-align: center; color: #8b949e; margin-bottom: 40px;">以下語音指令在 YouTube、Netflix 及 Bilibili 皆能無縫支援操控：</p>

        <!-- 表格或清單展示 -->
        <table style="width: 100%; border-collapse: collapse; background-color: #161b22; border-radius: 8px; overflow: hidden;">
            <thead>
                <tr style="background-color: #21262d; color: #58a6ff; text-align: left;">
                    <th style="padding: 15px 20px;">功能分類</th>
                    <th style="padding: 15px 20px;">語音指令範例</th>
                    <th style="padding: 15px 20px;">動作說明</th>
                </tr>
            </thead>
            <tbody style="color: #c9d1d9;">
                <tr style="border-bottom: 1px solid #30363d;">
                    <td style="padding: 15px 20px;">播放控制</td>
                    <td style="padding: 15px 20px; color: #3fb950;">「暫停」/「播放」</td>
                    <td style="padding: 15px 20px;">切換當前影片播放狀態</td>
                </tr>
                <tr style="border-bottom: 1px solid #30363d;">
                    <td style="padding: 15px 20px;">時間軸控制</td>
                    <td style="padding: 15px 20px; color: #3fb950;">「快轉 10 秒」/「倒退 10 秒」</td>
                    <td style="padding: 15px 20px;">跳轉影片進度</td>
                </tr>
                <tr style="border-bottom: 1px solid #30363d;">
                    <td style="padding: 15px 20px;">視窗與全螢幕</td>
                    <td style="padding: 15px 20px; color: #3fb950;">「開啟全螢幕」/「退出全螢幕」</td>
                    <td style="padding: 15px 20px;">最大化或還原畫面</td>
                </tr>
                <tr style="border-bottom: 1px solid #30363d;">
                    <td style="padding: 15px 20px;">音量調整</td>
                    <td style="padding: 15px 20px; color: #3fb950;">「音量調大」/「靜音」</td>
                    <td style="padding: 15px 20px;">調整或關閉系統播放音量</td>
                </tr>
                <tr>
                    <td style="padding: 15px 20px;">浮層編號點選</td>
                    <td style="padding: 15px 20px; color: #3fb950;">「點擊 1 號」/「點擊 5 號」</td>
                    <td style="padding: 15px 20px;">語音直接選取畫面上標註的影片卡片</td>
                </tr>
            </tbody>
        </table>

        <!-- 返回按鈕 -->
        <div style="text-align: center; margin-top: 40px;">
            <a href="index.html" class="pdf-btn">⬅ 返回專題首頁</a>
        </div>
    </div>
</body>
</html>
