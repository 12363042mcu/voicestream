<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>專題專刊展示 - VoiceStream</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .book-wrapper {
            padding: 40px 20px;
            text-align: center;
        }

        /* 擬真 A4 紙張容器 */
        .a4-sheet {
            width: 100%;
            max-width: 800px;
            height: 1130px; /* A4 比例約 1 : 1.414 */
            margin: 25px auto 35px auto;
            background-color: #ffffff;
            border-radius: 6px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5), 0 3px 10px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            border: 1px solid #30363d;
        }

        .a4-sheet iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="container book-wrapper">
        <h1 style="color: #58a6ff; font-size: 26px; margin-bottom: 10px;">專題成果專刊</h1>
        <p style="color: #8b949e; font-size: 15px;">跨平台語音控制影音瀏覽系統 — 期末成果展特刊</p>

        <!-- A4 紙張展示區 (直接嵌入 PDF) -->
        <div class="a4-sheet">
            <iframe src="project_book.pdf#toolbar=0" title="專題專刊"></iframe>
        </div>

        <div>
            <a href="index.html" class="pdf-btn" style="background-color: #238636; color: #fff; margin-right: 15px;">
                ⬅ 返回首頁
            </a>
           
        </div>
    </div>

</body>
</html>
